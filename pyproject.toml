[project]
name = "action-platform-plugin-example"
version = "0.1.0"
description = "Template for an Action Platform plugin: tools, a CLI command, an overlay, a release strategy, a replaced slot, lifecycle hooks."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Action Platform", email = "cloud@actionplatform.io" }]
dependencies = ["action-platform>=0.16"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "action-platform[mcp]"]

[project.entry-points."action_platform.plugins"]
example = "action_platform_plugin_example:ExamplePlugin"

[project.entry-points."action_platform.release_strategy"]
calver = "action_platform_plugin_example.release:Calver"

[project.entry-points."action_platform.changelog"]
plain = "action_platform_plugin_example.release:Plain"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["action_platform_plugin_example*"]

[tool.setuptools.package-data]
action_platform_plugin_example = ["overlays/**/*", "overlays/**/.*"]

[tool.ruff]
line-length = 88
